<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela NFL - Semana 4 Live Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --win-color: #22c55e;
            --live-color: #eab308;
            --border-color: #334155;
            --pending-color: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
        }

        .header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 1.8rem;
        }

        .refresh-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            background-color: var(--border-color);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 950px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* Tarjetas de Partidos */
        .match-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px 14px 14px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .match-card:hover {
            background-color: #16213a;
        }

        .prob-bar {
            grid-column: 1 / -1;
            display: flex;
            width: 100%;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .prob-segment {
            height: 100%;
            transition: width 0.4s ease;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .prob-segment.away {
            border-right: 1px solid rgba(255, 255, 255, 0.35);
        }

        .picks-panel {
            display: none;
            grid-column: 1 / -1;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.78rem;
            line-height: 1.4;
            color: #cbd5e1;
        }

        .picks-panel.open {
            display: grid;
        }

        .picks-col {
            min-width: 0;
        }

        .picks-col.away { text-align: left; }
        .picks-col.home { text-align: right; }

        .team {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .team.away { justify-content: flex-start; }
        .team.home { justify-content: flex-end; }

        .team-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .score {
            background: var(--card-bg);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 1.1rem;
            border: 1px solid var(--border-color);
            font-weight: bold;
        }

        .match-status-center {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-live { background-color: var(--live-color); color: #000; }
        .badge-final { background-color: var(--win-color); color: #000; }
        .badge-pending { background-color: var(--pending-color); color: #000; }

        .time-detail {
            font-size: 0.75rem;
            color: #a0aec0;
        }

        /* Tabla de Posiciones */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .leaderboard-table th {
            background-color: #0f172a;
            color: var(--accent-color);
            font-size: 0.85rem;
        }

        .leaderboard-table tr:hover { background-color: #2d3748; }

        .rank {
            font-weight: bold;
            color: var(--accent-color);
            width: 35px;
        }

        .player-name {
            text-align: left !important;
            font-weight: bold;
        }

        .badge-score {
            display: inline-block;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .badge-projected {
            display: inline-block;
            background-color: #a855f7;
            color: #fff;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .badge-winprob {
            display: inline-block;
            background-color: var(--win-color);
            color: #0f172a;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-status">
        <h1>🏈 Quiniela NFL - Semana 4 (2026) Live Tracker</h1>
        <button class="refresh-btn" onclick="fetchESPNLiveScores(true)">🔄 Actualizar Marcadores</button>
    </div>

    <div class="grid-container">
        <!-- Panel de Partidos -->
        <div class="panel">
            <h2>Partidos (Marcadores ESPN en Vivo)</h2>
            <div id="matches-container">Cargando marcadores en vivo...</div>
        </div>

        <!-- Tabla General de Posiciones -->
        <div class="panel">
            <h2>Tabla de Posiciones</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th style="text-align: left;">Jugador</th>
                        <th>MNF Tiebreaker</th>
                        <th>Puntos</th>
                        <th>Puntos Proyectados</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>

</div>

<script>
    // Partidos de la Semana 4, temporada 2026 (formato [visitante, local]).
    // El partido #16 ATL @ NO es el Monday Night, usado como desempate (MNF Tiebreaker).
    const MATCH_DEFINITIONS = [
        ["PIT", "CLE"], ["IND", "WSH"], ["TEN", "BAL"], ["NE", "BUF"],
        ["NYJ", "CHI"], ["JAX", "CIN"], ["DAL", "HOU"], ["ARI", "NYG"],
        ["LAR", "PHI"], ["GB", "TB"], ["MIA", "MIN"], ["KC", "LV"],
        ["LAC", "SEA"], ["DEN", "SF"], ["DET", "CAR"], ["ATL", "NO"]
    ];

    const MNF_MATCH_ID = 16; // ATL @ NO, lunes - juego de desempate

    // Helper para parsear "34-27" a la suma total de puntos (61)
    function parseScoreTiebreaker(rawScore) {
        if (!rawScore || !rawScore.includes('-')) return 40;
        const parts = rawScore.split('-');
        return (parseInt(parts[0]) || 0) + (parseInt(parts[1]) || 0);
    }

    // Jugadores con su acumulado previo a la Semana 4, marcador de desempate (MNF)
    // y picks por partido (ids 1-16, según el orden de MATCH_DEFINITIONS).
    const PLAYERS = [
        { name: "OSCAR", accumulated: 31, rawMNF: "23-31", mnfTotal: parseScoreTiebreaker("23-31"), picks: { 1: "PIT", 2: "IND", 3: "BAL", 4: "BUF", 5: "CHI", 6: "JAX", 7: "DAL", 8: "ARI", 9: "LAR", 10: "GB", 11: "MIN", 12: "KC", 13: "SEA", 14: "SF", 15: "DET", 16: "NO" } },
        { name: "GARA", accumulated: 31, rawMNF: "21-27", mnfTotal: parseScoreTiebreaker("21-27"), picks: { 1: "PIT", 2: "IND", 3: "BAL", 4: "BUF", 5: "CHI", 6: "JAX", 7: "DAL", 8: "ARI", 9: "LAR", 10: "GB", 11: "MIN", 12: "KC", 13: "SEA", 14: "SF", 15: "DET", 16: "NO" } },
        { name: "COCO", accumulated: 30, rawMNF: "17-30", mnfTotal: parseScoreTiebreaker("17-30"), picks: { 1: "PIT", 2: "WSH", 3: "BAL", 4: "BUF", 5: "CHI", 6: "CIN", 7: "HOU", 8: "NYG", 9: "LAR", 10: "GB", 11: "MIN", 12: "KC", 13: "SEA", 14: "SF", 15: "DET", 16: "NO" } },
        { name: "CHARLIE", accumulated: 30, rawMNF: "27-24", mnfTotal: parseScoreTiebreaker("27-24"), picks: { 1: "PIT", 2: "IND", 3: "BAL", 4: "BUF", 5: "CHI", 6: "CIN", 7: "HOU", 8: "ARI", 9: "LAR", 10: "GB", 11: "MIN", 12: "KC", 13: "SEA", 14: "SF", 15: "DET", 16: "ATL" } },
        { name: "PERUSI", accumulated: 30, rawMNF: "20-24", mnfTotal: parseScoreTiebreaker("20-24"), picks: { 1: "PIT", 2: "IND", 3: "BAL", 4: "BUF", 5: "CHI", 6: "CIN", 7: "DAL", 8: "NYG", 9: "LAR", 10: "GB", 11: "MIN", 12: "KC", 13: "SEA", 14: "SF", 15: "DET", 16: "NO" } },
        { name: "MANUEL", accumulated: 30, rawMNF: "17-24", mnfTotal: parseScoreTiebreaker("17-24"), picks: { 1: "PIT", 2: "IND", 3: "BAL", 4: "BUF", 5: "CHI", 6: "JAX", 7: "DAL", 8: "ARI", 9: "PHI", 10: "GB", 11: "MIN", 12: "KC", 13: "SEA", 14: "SF", 15: "DET", 16: "NO" } },
        { name: "GABRIEL", accumulated: 29, rawMNF: "24-31", mnfTotal: parseScoreTiebreaker("24-31"), picks: { 1: "PIT", 2: "WSH", 3: "BAL", 4: "BUF", 5: "CHI", 6: "CIN", 7: "HOU", 8: "NYG", 9: "LAR", 10: "GB", 11: "MIN", 12: "LV", 13: "SEA", 14: "SF", 15: "CAR", 16: "NO" } },
        { name: "CONTRERAS", accumulated: 29, rawMNF: "17-24", mnfTotal: parseScoreTiebreaker("17-24"), picks: { 1: "CLE", 2: "WSH", 3: "BAL", 4: "BUF", 5: "NYJ", 6: "CIN", 7: "HOU", 8: "ARI", 9: "LAR", 10: "GB", 11: "MIN", 12: "LV", 13: "SEA", 14: "SF", 15: "CAR", 16: "NO" } },
        { name: "GUS", accumulated: 29, rawMNF: "21-24", mnfTotal: parseScoreTiebreaker("21-24"), picks: { 1: "CLE", 2: "IND", 3: "BAL", 4: "BUF", 5: "CHI", 6: "JAX", 7: "DAL", 8: "ARI", 9: "LAR", 10: "GB", 11: "MIN", 12: "KC", 13: "SEA", 14: "SF", 15: "DET", 16: "NO" } },
        { name: "JERRY", accumulated: 28, rawMNF: "10-17", mnfTotal: parseScoreTiebreaker("10-17"), picks: { 1: "CLE", 2: "IND", 3: "BAL", 4: "BUF", 5: "CHI", 6: "CIN", 7: "HOU", 8: "ARI", 9: "LAR", 10: "GB", 11: "MIN", 12: "LV", 13: "SEA", 14: "DEN", 15: "DET", 16: "NO" } },
        { name: "PARRA", accumulated: 28, rawMNF: "23-20", mnfTotal: parseScoreTiebreaker("23-20"), picks: { 1: "PIT", 2: "IND", 3: "BAL", 4: "BUF", 5: "CHI", 6: "JAX", 7: "HOU", 8: "ARI", 9: "LAR", 10: "GB", 11: "MIN", 12: "KC", 13: "SEA", 14: "SF", 15: "DET", 16: "ATL" } },
        { name: "GILBERTO", accumulated: 27, rawMNF: "23-24", mnfTotal: parseScoreTiebreaker("23-24"), picks: { 1: "PIT", 2: "IND", 3: "BAL", 4: "BUF", 5: "CHI", 6: "JAX", 7: "HOU", 8: "ARI", 9: "LAR", 10: "TB", 11: "MIN", 12: "KC", 13: "SEA", 14: "SF", 15: "DET", 16: "NO" } },
        { name: "CARLOS", accumulated: 27, rawMNF: "17-27", mnfTotal: parseScoreTiebreaker("17-27"), picks: { 1: "PIT", 2: "IND", 3: "BAL", 4: "BUF", 5: "CHI", 6: "CIN", 7: "DAL", 8: "NYG", 9: "LAR", 10: "GB", 11: "MIN", 12: "KC", 13: "SEA", 14: "DEN", 15: "DET", 16: "NO" } },
        { name: "ISMAEL", accumulated: 24, rawMNF: "24-21", mnfTotal: parseScoreTiebreaker("24-21"), picks: { 1: "PIT", 2: "IND", 3: "BAL", 4: "BUF", 5: "NYJ", 6: "JAX", 7: "DAL", 8: "ARI", 9: "LAR", 10: "GB", 11: "MIN", 12: "KC", 13: "SEA", 14: "SF", 15: "DET", 16: "ATL" } },
        { name: "HARRY", accumulated: 24, rawMNF: "21-27", mnfTotal: parseScoreTiebreaker("21-27"), picks: { 1: "PIT", 2: "IND", 3: "BAL", 4: "BUF", 5: "CHI", 6: "CIN", 7: "DAL", 8: "NYG", 9: "LAR", 10: "GB", 11: "MIN", 12: "KC", 13: "SEA", 14: "SF", 15: "DET", 16: "NO" } }
    ];

    function normalizeTeam(team) {
        if (!team) return "";
        const u = team.toUpperCase();
        if (u === "WAS" || u === "WSH") return "WSH";
        return u;
    }

    function teamMatch(t1, t2) {
        return normalizeTeam(t1) === normalizeTeam(t2);
    }

    const TEAM_COLORS = {
        ARI: { fill: "#97233F", border: "#000000" }, ATL: { fill: "#A71930", border: "#000000" },
        BAL: { fill: "#241773", border: "#000000" }, BUF: { fill: "#00338D", border: "#C60C30" },
        CAR: { fill: "#0085CA", border: "#101820" }, CHI: { fill: "#0B162A", border: "#C83803" },
        CIN: { fill: "#FB4F14", border: "#000000" }, CLE: { fill: "#311D00", border: "#FF3C00" },
        DAL: { fill: "#003594", border: "#041E42" }, DEN: { fill: "#FB4F14", border: "#002244" },
        DET: { fill: "#0076B6", border: "#B0B7BC" }, GB:  { fill: "#203731", border: "#FFB612" },
        HOU: { fill: "#03202F", border: "#A71930" }, IND: { fill: "#002C5F", border: "#A2AAAD" },
        JAX: { fill: "#101820", border: "#D7A22A" }, KC:  { fill: "#E31837", border: "#FFB81C" },
        LAC: { fill: "#0080C6", border: "#FFC20E" }, LAR: { fill: "#003594", border: "#FFA300" },
        LV:  { fill: "#000000", border: "#A5ACAF" }, MIA: { fill: "#008E97", border: "#FC4C02" },
        MIN: { fill: "#4F2683", border: "#FFC62F" }, NE:  { fill: "#002244", border: "#C60C30" },
        NO:  { fill: "#D3BC8D", border: "#101820" }, NYG: { fill: "#0B2265", border: "#A71930" },
        NYJ: { fill: "#125740", border: "#000000" }, PHI: { fill: "#004C54", border: "#A5ACAF" },
        PIT: { fill: "#FFB612", border: "#101820" }, SEA: { fill: "#002244", border: "#69BE28" },
        SF:  { fill: "#AA0000", border: "#B3995D" }, TB:  { fill: "#D50A0A", border: "#34302B" },
        TEN: { fill: "#0C2340", border: "#4B92DB" }, WSH: { fill: "#5A1414", border: "#FFB612" }
    };

    function teamColors(team) {
        return TEAM_COLORS[normalizeTeam(team)] || { fill: "#64748b", border: "#334155" };
    }

    function perceivedBrightness(hex) {
        const h = hex.replace('#', '');
        const r = parseInt(h.substring(0, 2), 16);
        const g = parseInt(h.substring(2, 4), 16);
        const b = parseInt(h.substring(4, 6), 16);
        return (0.299 * r + 0.587 * g + 0.114 * b);
    }

    function accentBorder(hex) {
        return perceivedBrightness(hex) < 70 ? "rgba(226,232,240,0.85)" : hex;
    }

    let liveMatchesState = [];
    let mnfProjectedTotalPoints = 44.5;
    let lastStateHash = "";
    const expandedMatches = new Set();

    // Agrupa los picks de todos los jugadores para un partido y decide cómo mostrarlos:
    // - Si todos eligieron el mismo equipo: "Todos los jugadores" bajo ese equipo.
    // - Si 5 o menos eligieron un equipo: se listan esos nombres, y el otro equipo
    //   muestra "Todos los demás".
    // - En cualquier otro caso (ambos lados con más de 5): se listan todos los nombres.
    function getPicksDisplay(matchId, homeTeam, awayTeam) {
        const homeNames = [];
        const awayNames = [];

        PLAYERS.forEach(p => {
            const pick = p.picks[matchId];
            if (teamMatch(pick, homeTeam)) homeNames.push(p.name);
            else if (teamMatch(pick, awayTeam)) awayNames.push(p.name);
        });

        let awayText = '';
        let homeText = '';
        const minCount = Math.min(homeNames.length, awayNames.length);

        if (minCount === 0) {
            if (awayNames.length > 0) {
                awayText = 'Todos los jugadores';
            } else if (homeNames.length > 0) {
                homeText = 'Todos los jugadores';
            }
        } else if (minCount <= 5) {
            if (awayNames.length <= homeNames.length) {
                awayText = awayNames.join(', ');
                homeText = 'Todos los demás';
            } else {
                homeText = homeNames.join(', ');
                awayText = 'Todos los demás';
            }
        } else {
            awayText = awayNames.join(', ');
            homeText = homeNames.join(', ');
        }

        return { awayText, homeText };
    }

    function extractHomeWinProbability(comp, status, homeScore, awayScore) {
        if (status === "FINAL") {
            if (comp.situation && comp.situation.lastPlay && comp.situation.lastPlay.probability) {
                return (comp.situation.lastPlay.probability.homeWinPercentage || (homeScore > awayScore ? 100 : 0)) / 100;
            }
            return homeScore > awayScore ? 0.99 : (homeScore < awayScore ? 0.01 : 0.5);
        }

        if (comp.situation && comp.situation.lastPlay) {
            const prob = comp.situation.lastPlay.probability || comp.situation.lastPlay.winProbability;
            if (prob) {
                const homePct = prob.homeWinPercentage !== undefined ? prob.homeWinPercentage : prob;
                if (typeof homePct === 'number' && !isNaN(homePct)) {
                    return homePct > 1 ? homePct / 100 : homePct;
                }
            }
        }

        if (comp.probabilities && comp.probabilities.length > 0) {
            const homeProb = comp.probabilities[0].homeWinPercentage;
            if (homeProb !== undefined) return homeProb > 1 ? homeProb / 100 : homeProb;
        }

        if (comp.odds && comp.odds.length > 0) {
            const odds = comp.odds[0];
            if (odds.homeTeamOdds && odds.homeTeamOdds.winPercentage) {
                return odds.homeTeamOdds.winPercentage / 100;
            }
        }

        if (status === "LIVE") {
            const diff = homeScore - awayScore;
            const estimated = 1 / (1 + Math.exp(-0.25 * diff));
            return Math.min(Math.max(estimated, 0.05), 0.95);
        }

        return 0.50;
    }

    // Formatea una fecha ISO (UTC) de ESPN a hora del Pacífico (Los Ángeles),
    // para que los partidos que aún no inician muestren su horario en esa zona.
    const pacificTimeFormatter = new Intl.DateTimeFormat('es-MX', {
        timeZone: 'America/Los_Angeles',
        weekday: 'short',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
    });
    function formatPacificTime(isoDateString) {
        try {
            const d = new Date(isoDateString);
            return pacificTimeFormatter.format(d).replace(/\./g, '') + ' PT';
        } catch (e) {
            return '';
        }
    }

    async function fetchESPNLiveScores(forceRefresh = false) {
        try {
            const response = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard");
            const data = await response.json();
            const events = data.events || [];

            liveMatchesState = MATCH_DEFINITIONS.map((pair, index) => {
                const awayTeam = normalizeTeam(pair[0]);
                const homeTeam = normalizeTeam(pair[1]);

                const event = events.find(e => {
                    const competitors = e.competitions[0].competitors;
                    const teams = competitors.map(c => normalizeTeam(c.team.abbreviation));
                    return teams.includes(awayTeam) && teams.includes(homeTeam);
                });

                if (event) {
                    const comp = event.competitions[0];
                    const homeComp = comp.competitors.find(c => teamMatch(c.team.abbreviation, homeTeam));
                    const awayComp = comp.competitors.find(c => teamMatch(c.team.abbreviation, awayTeam));

                    const state = event.status?.type?.state;
                    const statusName = event.status?.type?.name || "";

                    let status = "PENDING";
                    if (state === "post" || statusName.includes("FINAL") || statusName.includes("FULL_TIME")) {
                        status = "FINAL";
                    } else if (state === "in" || statusName.includes("IN_PROGRESS") || statusName.includes("HALFTIME")) {
                        status = "LIVE";
                    }

                    const homeScore = parseInt(homeComp.score) || 0;
                    const awayScore = parseInt(awayComp.score) || 0;
                    const homeWinProb = extractHomeWinProbability(comp, status, homeScore, awayScore);

                    if (index + 1 === MNF_MATCH_ID) {
                        if (status === "LIVE" || status === "FINAL") {
                            mnfProjectedTotalPoints = homeScore + awayScore;
                        } else if (comp.odds && comp.odds.length > 0 && comp.odds[0].overUnder) {
                            mnfProjectedTotalPoints = parseFloat(comp.odds[0].overUnder);
                        }
                    }

                    const detail = status === 'PENDING'
                        ? (formatPacificTime(event.date) || event.status.type.shortDetail || "")
                        : (event.status.type.shortDetail || "");

                    return {
                        id: index + 1,
                        away: pair[0],
                        home: pair[1],
                        awayScore: awayScore,
                        homeScore: homeScore,
                        awayLogo: awayComp.team.logo,
                        homeLogo: homeComp.team.logo,
                        status: status,
                        detail: detail,
                        homeWinProb: homeWinProb
                    };
                } else {
                    return {
                        id: index + 1,
                        away: pair[0],
                        home: pair[1],
                        awayScore: 0,
                        homeScore: 0,
                        awayLogo: `https://a.espncdn.com/i/teamlogos/nfl/500/${awayTeam}.png`,
                        homeLogo: `https://a.espncdn.com/i/teamlogos/nfl/500/${homeTeam}.png`,
                        status: "PENDING",
                        detail: "No Iniciado",
                        homeWinProb: 0.5
                    };
                }
            });

            const currentStateHash = JSON.stringify(liveMatchesState.map(m => `${m.id}-${m.status}-${m.awayScore}-${m.homeScore}-${m.homeWinProb.toFixed(2)}`)) + `-${mnfProjectedTotalPoints}`;

            if (currentStateHash !== lastStateHash || forceRefresh) {
                lastStateHash = currentStateHash;
                renderMatches();
                calculateAndRenderLeaderboard();
            }
        } catch (error) {
            console.error("Error al obtener datos de ESPN:", error);
        }
    }

    function renderMatches() {
        const container = document.getElementById('matches-container');
        container.innerHTML = '';

        liveMatchesState.forEach(m => {
            const div = document.createElement('div');
            div.className = 'match-card';

            let badgeClass = 'badge-pending';
            let statusText = 'No Iniciado';
            if (m.status === 'FINAL') {
                badgeClass = 'badge-final';
                statusText = 'Final';
            } else if (m.status === 'LIVE') {
                badgeClass = 'badge-live';
                statusText = 'En Vivo';
            }

            const awayC = teamColors(m.away);
            const homeC = teamColors(m.home);

            const homePct = (m.homeWinProb * 100).toFixed(1);
            const awayPct = (100 - homePct).toFixed(1);

            const isOpen = expandedMatches.has(m.id);
            const picks = getPicksDisplay(m.id, m.home, m.away);

            div.innerHTML = `
                <div class="team away">
                    <img class="team-logo" src="${m.awayLogo}" alt="${m.away}">
                    <span>${m.away}</span>
                    <span class="score">${m.awayScore}</span>
                </div>
                <div class="match-status-center">
                    <span class="badge ${badgeClass}">${statusText}</span>
                    <span class="time-detail">${m.detail}</span>
                </div>
                <div class="team home">
                    <span class="score">${m.homeScore}</span>
                    <span>${m.home}</span>
                    <img class="team-logo" src="${m.homeLogo}" alt="${m.home}">
                </div>
                <div class="prob-bar">
                    <div class="prob-segment away" style="width:${awayPct}%; background:${awayC.fill}; border-bottom:3px solid ${accentBorder(awayC.border)};" title="${m.away}: ${awayPct}%"></div>
                    <div class="prob-segment home" style="width:${homePct}%; background:${homeC.fill}; border-bottom:3px solid ${accentBorder(homeC.border)};" title="${m.home}: ${homePct}%"></div>
                </div>
                <div class="picks-panel ${isOpen ? 'open' : ''}">
                    <div class="picks-col away">${picks.awayText}</div>
                    <div class="picks-col home">${picks.homeText}</div>
                </div>
            `;

            div.addEventListener('click', () => {
                if (expandedMatches.has(m.id)) {
                    expandedMatches.delete(m.id);
                } else {
                    expandedMatches.add(m.id);
                }
                renderMatches();
            });

            container.appendChild(div);
        });
    }

    function runMonteCarloSimulations() {
        const numSimulations = 10000;
        const winCounts = new Array(PLAYERS.length).fill(0);
        const stdDevMNF = 10.5;

        function randomNormal(mean, std) {
            let u1 = Math.random();
            let u2 = Math.random();
            while (u1 === 0) u1 = Math.random();
            let z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            return mean + z0 * std;
        }

        for (let sim = 0; sim < numSimulations; sim++) {
            const simWinners = {};
            liveMatchesState.forEach(m => {
                if (m.status === 'FINAL') {
                    simWinners[m.id] = (m.homeScore > m.awayScore) ? m.home : m.away;
                } else {
                    simWinners[m.id] = (Math.random() < m.homeWinProb) ? m.home : m.away;
                }
            });

            const simulatedMNFTotal = randomNormal(mnfProjectedTotalPoints, stdDevMNF);

            let maxPoints = -1;
            const simScores = PLAYERS.map(player => {
                let pts = 0;
                liveMatchesState.forEach(m => {
                    if (teamMatch(player.picks[m.id], simWinners[m.id])) pts++;
                });
                if (pts > maxPoints) maxPoints = pts;
                return pts;
            });

            let tiedIndices = [];
            simScores.forEach((score, idx) => {
                if (score === maxPoints) tiedIndices.push(idx);
            });

            if (tiedIndices.length === 1) {
                winCounts[tiedIndices[0]] += 1;
            } else {
                let minDiff = Infinity;
                let tieWinners = [];

                tiedIndices.forEach(idx => {
                    const diff = Math.abs(PLAYERS[idx].mnfTotal - simulatedMNFTotal);
                    if (diff < minDiff) {
                        minDiff = diff;
                        tieWinners = [idx];
                    } else if (diff === minDiff) {
                        tieWinners.push(idx);
                    }
                });

                tieWinners.forEach(wIdx => {
                    winCounts[wIdx] += (1 / tieWinners.length);
                });
            }
        }

        return winCounts.map(count => (count / numSimulations) * 100);
    }

    // Método de los Mayores Residuos (Hare-Niemeyer) para garantizar suma exacta de 100%
    function roundPercentagesTo100(numbers) {
        const floatNumbers = numbers.map(n => parseFloat(n) || 0);
        const sum = floatNumbers.reduce((acc, curr) => acc + curr, 0);

        if (sum === 0) return floatNumbers.map(() => 0);

        const normalized = floatNumbers.map(n => (n / sum) * 100);

        const items = normalized.map((num, index) => {
            const floorVal = Math.floor(num);
            return {
                index: index,
                floorVal: floorVal,
                remainder: num - floorVal
            };
        });

        const currentSum = items.reduce((acc, item) => acc + item.floorVal, 0);
        let remainderToDistribute = 100 - currentSum;

        items.sort((a, b) => b.remainder - a.remainder);

        for (let i = 0; i < remainderToDistribute; i++) {
            items[i].floorVal += 1;
        }

        items.sort((a, b) => a.index - b.index);

        return items.map(item => item.floorVal);
    }

    function calculateAndRenderLeaderboard() {
        const rawWinProbs = runMonteCarloSimulations();
        const roundedWinProbs = roundPercentagesTo100(rawWinProbs);

        const playerScores = PLAYERS.map((player, idx) => {
            let weekCurrent = 0;   // Aciertos reales actuales (bajo la regla de la quiniela)
            let weekExpected = 0;  // Puntos proyectados (suma de probabilidades)

            liveMatchesState.forEach(m => {
                const pickedTeam = player.picks[m.id];
                if (!pickedTeam) return;

                const isHomeWinner = m.homeScore > m.awayScore;
                const isAwayWinner = m.awayScore > m.homeScore;

                if (m.status === 'FINAL') {
                    const won = (isHomeWinner && teamMatch(pickedTeam, m.home)) || (isAwayWinner && teamMatch(pickedTeam, m.away));
                    if (won) weekCurrent++;
                    weekExpected += won ? 1 : 0;
                } else {
                    if (m.status === 'LIVE' && (isHomeWinner || isAwayWinner)) {
                        if ((isHomeWinner && teamMatch(pickedTeam, m.home)) || (isAwayWinner && teamMatch(pickedTeam, m.away))) {
                            weekCurrent++;
                        }
                    }
                    const pWin = teamMatch(pickedTeam, m.home) ? m.homeWinProb : (1 - m.homeWinProb);
                    weekExpected += pWin;
                }
            });

            return {
                name: player.name,
                rawMNF: player.rawMNF,
                mnfTotal: player.mnfTotal,
                weekCurrent: weekCurrent,
                weekExpected: weekExpected,
                rawWinProb: rawWinProbs[idx],
                winProb: roundedWinProbs[idx]
            };
        });

        // Orden principal: probabilidad real (sin redondear) de ganar la quiniela.
        playerScores.sort((a, b) =>
            b.rawWinProb - a.rawWinProb ||
            b.weekExpected - a.weekExpected ||
            b.weekCurrent - a.weekCurrent
        );

        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = '';

        playerScores.forEach((ps, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="rank">${index + 1}</td>
                <td class="player-name">${ps.name}</td>
                <td><strong style="color: #cbd5e1;">${ps.rawMNF}</strong></td>
                <td><span class="badge-score">${ps.weekCurrent}</span></td>
                <td><span class="badge-projected">${Math.round(ps.weekExpected)}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    fetchESPNLiveScores();
    setInterval(() => fetchESPNLiveScores(false), 30000);
</script>
