<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela NFL - Live Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --win-color: #22c55e;
            --live-color: #eab308;
            --border-color: #334155;
            --pending-color: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
        }

        .header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 1.8rem;
        }

        .refresh-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            background-color: var(--border-color);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 950px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* Tarjetas de Partidos */
        .match-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .team.away { justify-content: flex-start; }
        .team.home { justify-content: flex-end; }

        .team-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .score {
            background: var(--card-bg);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 1.1rem;
            border: 1px solid var(--border-color);
            font-weight: bold;
        }

        .match-status-center {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-live { background-color: var(--live-color); color: #000; }
        .badge-final { background-color: var(--win-color); color: #000; }
        .badge-pending { background-color: var(--pending-color); color: #000; }

        .time-detail {
            font-size: 0.75rem;
            color: #a0aec0;
        }

        /* Tabla de Posiciones */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .leaderboard-table th {
            background-color: #0f172a;
            color: var(--accent-color);
            font-size: 0.85rem;
        }

        .leaderboard-table tr:hover { background-color: #2d3748; }

        .rank {
            font-weight: bold;
            color: var(--accent-color);
            width: 35px;
        }

        .player-name {
            text-align: left !important;
            font-weight: bold;
        }

        .badge-score {
            display: inline-block;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .badge-projected {
            display: inline-block;
            background-color: #a855f7;
            color: #fff;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .badge-winprob {
            display: inline-block;
            background-color: var(--win-color);
            color: #0f172a;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-status">
        <h1>🏈 Quiniela NFL - Live Tracker</h1>
        <button class="refresh-btn" onclick="fetchESPNLiveScores(true)">🔄 Actualizar Marcadores</button>
    </div>

    <div class="grid-container">
        <!-- Panel de Partidos -->
        <div class="panel">
            <h2>Partidos (Marcadores ESPN en Vivo)</h2>
            <div id="matches-container">Cargando marcadores en vivo...</div>
        </div>

        <!-- Tabla General de Posiciones -->
        <div class="panel">
            <h2>Tabla de Posiciones</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th style="text-align: left;">Jugador</th>
                        <th>MNF Tiebreaker</th>
                        <th>Week</th>
                        <th>Projected</th>
                        <th>Win Prob %</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Partidos de la Semana (El partido #16 PHI vs CHI es el MNF de desempate)
    const MATCH_DEFINITIONS = [
        ["ATL", "GB"], ["LAC", "BUF"], ["CAR", "CLE"], ["NYJ", "DET"],
        ["HOU", "IND"], ["NE", "JAX"], ["KC", "MIA"], ["TEN", "NYG"],
        ["CIN", "PIT"], ["SEA", "WSH"], ["ARI", "SF"], ["MIN", "TB"],
        ["BAL", "DAL"], ["LV", "NO"], ["LAR", "DEN"], ["PHI", "CHI"]
    ];

    const MNF_MATCH_ID = 16; // Partido 16 es el juego de desempate

    // Helper para parsear "34-27" a la suma total de puntos (61)
    function parseScoreTiebreaker(rawScore) {
        if (!rawScore || !rawScore.includes('-')) return 40;
        const parts = rawScore.split('-');
        return (parseInt(parts[0]) || 0) + (parseInt(parts[1]) || 0);
    }

    // Jugadores con Marcador Predicho de la Columna AX
    const PLAYERS = [
        { name: "GABRIEL", accumulated: 23, rawMNF: "34-27", mnfTotal: parseScoreTiebreaker("34-27"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "HOU", 6: "NE", 7: "KC", 8: "TEN", 9: "CIN", 10: "SEA", 11: "SF", 12: "MIN", 13: "BAL", 14: "NO", 15: "LAR", 16: "PHI" } },
        { name: "GARA", accumulated: 23, rawMNF: "21-9", mnfTotal: parseScoreTiebreaker("21-9"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "IND", 6: "JAX", 7: "KC", 8: "TEN", 9: "CIN", 10: "SEA", 11: "SF", 12: "TB", 13: "BAL", 14: "LV", 15: "LAR", 16: "PHI" } },
        { name: "COCO", accumulated: 22, rawMNF: "35-10", mnfTotal: parseScoreTiebreaker("35-10"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "HOU", 6: "JAX", 7: "KC", 8: "NYG", 9: "CIN", 10: "SEA", 11: "SF", 12: "MIN", 13: "BAL", 14: "NO", 15: "LAR", 16: "PHI" } },
        { name: "CHARLIE", accumulated: 22, rawMNF: "28-17", mnfTotal: parseScoreTiebreaker("28-17"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "HOU", 6: "JAX", 7: "KC", 8: "NYG", 9: "CIN", 10: "SEA", 11: "SF", 12: "MIN", 13: "BAL", 14: "NO", 15: "LAR", 16: "PHI" } },
        { name: "CONTRERAS", accumulated: 22, rawMNF: "33-15", mnfTotal: parseScoreTiebreaker("33-15"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "HOU", 6: "JAX", 7: "KC", 8: "TEN", 9: "CIN", 10: "SEA", 11: "SF", 12: "MIN", 13: "BAL", 14: "NO", 15: "LAR", 16: "PHI" } },
        { name: "OSCAR", accumulated: 22, rawMNF: "23-17", mnfTotal: parseScoreTiebreaker("23-17"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "HOU", 6: "JAX", 7: "KC", 8: "NYG", 9: "CIN", 10: "SEA", 11: "SF", 12: "MIN", 13: "BAL", 14: "NO", 15: "LAR", 16: "PHI" } },
        { name: "JERRY", accumulated: 22, rawMNF: "30-10", mnfTotal: parseScoreTiebreaker("30-10"), picks: { 1: "GB", 2: "BUF", 3: "CLE", 4: "DET", 5: "HOU", 6: "NE", 7: "KC", 8: "TEN", 9: "CIN", 10: "SEA", 11: "SF", 12: "TB", 13: "BAL", 14: "NO", 15: "LAR", 16: "PHI" } },
        { name: "PERUSI", accumulated: 21, rawMNF: "28-14", mnfTotal: parseScoreTiebreaker("28-14"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "IND", 6: "NE", 7: "KC", 8: "NYG", 9: "CIN", 10: "SEA", 11: "SF", 12: "MIN", 13: "BAL", 14: "NO", 15: "DEN", 16: "PHI" } },
        { name: "MANUEL", accumulated: 21, rawMNF: "24-20", mnfTotal: parseScoreTiebreaker("24-20"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "IND", 6: "JAX", 7: "KC", 8: "NYG", 9: "CIN", 10: "SEA", 11: "SF", 12: "MIN", 13: "BAL", 14: "NO", 15: "LAR", 16: "PHI" } },
        { name: "GILBERTO", accumulated: 20, rawMNF: "27-17", mnfTotal: parseScoreTiebreaker("27-17"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "IND", 6: "JAX", 7: "KC", 8: "TEN", 9: "CIN", 10: "SEA", 11: "SF", 12: "TB", 13: "DAL", 14: "NO", 15: "DEN", 16: "PHI" } },
        { name: "GUS", accumulated: 20, rawMNF: "38-14", mnfTotal: parseScoreTiebreaker("38-14"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "IND", 6: "JAX", 7: "KC", 8: "TEN", 9: "CIN", 10: "SEA", 11: "SF", 12: "MIN", 13: "BAL", 14: "LV", 15: "LAR", 16: "PHI" } },
        { name: "PARRA", accumulated: 20, rawMNF: "30-16", mnfTotal: parseScoreTiebreaker("30-16"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "HOU", 6: "JAX", 7: "KC", 8: "NYG", 9: "CIN", 10: "SEA", 11: "SF", 12: "MIN", 13: "BAL", 14: "NO", 15: "LAR", 16: "PHI" } },
        { name: "CARLOS", accumulated: 19, rawMNF: "27-17", mnfTotal: parseScoreTiebreaker("27-17"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "HOU", 6: "JAX", 7: "KC", 8: "NYG", 9: "CIN", 10: "SEA", 11: "SF", 12: "MIN", 13: "DAL", 14: "NO", 15: "DEN", 16: "PHI" } },
        { name: "ISMAEL", accumulated: 19, rawMNF: "28-14", mnfTotal: parseScoreTiebreaker("28-14"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "HOU", 6: "NE", 7: "KC", 8: "TEN", 9: "CIN", 10: "SEA", 11: "SF", 12: "TB", 13: "BAL", 14: "NO", 15: "LAR", 16: "PHI" } },
        { name: "HARRY", accumulated: 19, rawMNF: "14-21", mnfTotal: parseScoreTiebreaker("14-21"), picks: { 1: "GB", 2: "BUF", 3: "CAR", 4: "DET", 5: "HOU", 6: "NE", 7: "KC", 8: "TEN", 9: "CIN", 10: "SEA", 11: "SF", 12: "TB", 13: "BAL", 14: "NO", 15: "LAR", 16: "PHI" } }
    ];

    const TEAM_MAP = { "WSH": "WAS" };
    function normalizeTeam(team) { return TEAM_MAP[team] || team; }

    let liveMatchesState = [];
    let mnfProjectedTotalPoints = 44.5;
    let lastStateHash = ""; // Guardará la firma del estado anterior

    async function fetchESPNLiveScores(forceRefresh = false) {
        try {
            const response = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard");
            const data = await response.json();
            const events = data.events || [];

            liveMatchesState = MATCH_DEFINITIONS.map((pair, index) => {
                const awayTeam = normalizeTeam(pair[0]);
                const homeTeam = normalizeTeam(pair[1]);

                const event = events.find(e => {
                    const competitors = e.competitions[0].competitors;
                    const teams = competitors.map(c => c.team.abbreviation);
                    return teams.includes(awayTeam) && teams.includes(homeTeam);
                });

                if (event) {
                    const comp = event.competitions[0];
                    const homeComp = comp.competitors.find(c => c.team.abbreviation === homeTeam);
                    const awayComp = comp.competitors.find(c => c.team.abbreviation === awayTeam);
                    const statusType = event.status.type.name;

                    let status = "PENDING";
                    if (statusType === "STATUS_FINAL" || statusType === "STATUS_FULL_TIME") {
                        status = "FINAL";
                    } else if (statusType === "STATUS_IN_PROGRESS" || statusType === "STATUS_HALFTIME") {
                        status = "LIVE";
                    }

                    let homeWinProb = 0.5;
                    if (status === "FINAL") {
                        homeWinProb = (parseInt(homeComp.score) > parseInt(awayComp.score)) ? 1.0 : 0.0;
                    } else {
                        if (comp.situation && comp.situation.lastPlay && comp.situation.lastPlay.probability) {
                            homeWinProb = (comp.situation.lastPlay.probability.homeWinPercentage || 50) / 100;
                        } else if (comp.odds && comp.odds.length > 0 && comp.odds[0].homeTeamOdds) {
                            homeWinProb = comp.odds[0].homeTeamOdds.favorite ? 0.6 : 0.4;
                        }
                    }

                    // Extraer marcador real o línea Over/Under del partido MNF
                    if (index + 1 === MNF_MATCH_ID) {
                        if (status === "LIVE" || status === "FINAL") {
                            mnfProjectedTotalPoints = (parseInt(homeComp.score) || 0) + (parseInt(awayComp.score) || 0);
                        } else if (comp.odds && comp.odds.length > 0 && comp.odds[0].overUnder) {
                            mnfProjectedTotalPoints = parseFloat(comp.odds[0].overUnder);
                        }
                    }

                    return {
                        id: index + 1,
                        away: pair[0],
                        home: pair[1],
                        awayScore: parseInt(awayComp.score) || 0,
                        homeScore: parseInt(homeComp.score) || 0,
                        awayLogo: awayComp.team.logo,
                        homeLogo: homeComp.team.logo,
                        status: status,
                        detail: event.status.type.shortDetail || "",
                        projectedWinner: homeWinProb >= 0.5 ? pair[1] : pair[0],
                        homeWinProb: homeWinProb
                    };
                } else {
                    return {
                        id: index + 1,
                        away: pair[0],
                        home: pair[1],
                        awayScore: 0,
                        homeScore: 0,
                        awayLogo: `https://a.espncdn.com/i/teamlogos/nfl/500/${awayTeam}.png`,
                        homeLogo: `https://a.espncdn.com/i/teamlogos/nfl/500/${homeTeam}.png`,
                        status: "PENDING",
                        detail: "No Iniciado",
                        projectedWinner: pair[1],
                        homeWinProb: 0.5
                    };
                }
            });

            // Generar la firma única del estado actual de los partidos
            const currentStateHash = JSON.stringify(liveMatchesState.map(m => `${m.id}-${m.status}-${m.awayScore}-${m.homeScore}-${m.homeWinProb.toFixed(2)}`)) + `-${mnfProjectedTotalPoints}`;

            // Solo re-renderizamos y simulamos si hubo un cambio real en los datos o si el usuario hizo clic en actualizar
            if (currentStateHash !== lastStateHash || forceRefresh) {
                lastStateHash = currentStateHash;
                renderMatches();
                calculateAndRenderLeaderboard();
            }
        } catch (error) {
            console.error("Error al obtener datos de ESPN:", error);
        }
    }

    function renderMatches() {
        const container = document.getElementById('matches-container');
        container.innerHTML = '';

        liveMatchesState.forEach(m => {
            const div = document.createElement('div');
            div.className = 'match-card';

            let badgeClass = 'badge-pending';
            let statusText = 'No Iniciado';
            if (m.status === 'FINAL') {
                badgeClass = 'badge-final';
                statusText = 'Final';
            } else if (m.status === 'LIVE') {
                badgeClass = 'badge-live';
                statusText = 'En Vivo';
            }

            div.innerHTML = `
                <div class="team away">
                    <img class="team-logo" src="${m.awayLogo}" alt="${m.away}">
                    <span>${m.away}</span>
                    <span class="score">${m.awayScore}</span>
                </div>
                <div class="match-status-center">
                    <span class="badge ${badgeClass}">${statusText}</span>
                    <span class="time-detail">${m.detail}</span>
                </div>
                <div class="team home">
                    <span class="score">${m.homeScore}</span>
                    <span>${m.home}</span>
                    <img class="team-logo" src="${m.homeLogo}" alt="${m.home}">
                </div>
            `;
            container.appendChild(div);
        });
    }

    // Simulación Monte Carlo estocástica para desempate de MNF
    function runMonteCarloSimulations() {
        const numSimulations = 10000;
        const winCounts = new Array(PLAYERS.length).fill(0);
        const stdDevMNF = 10.5; // Desviación estándar típica de puntos en la NFL

        // Helper Box-Muller para distribución normal
        function randomNormal(mean, std) {
            let u1 = Math.random();
            let u2 = Math.random();
            while (u1 === 0) u1 = Math.random();
            let z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            return mean + z0 * std;
        }

        for (let sim = 0; sim < numSimulations; sim++) {
            // 1. Simular ganadores de partidos restantes
            const simWinners = {};
            liveMatchesState.forEach(m => {
                if (m.status === 'FINAL') {
                    simWinners[m.id] = (m.homeScore > m.awayScore) ? m.home : m.away;
                } else {
                    simWinners[m.id] = (Math.random() < m.homeWinProb) ? m.home : m.away;
                }
            });

            // 2. Simular un marcador total realista del MNF en esta iteración
            const simulatedMNFTotal = randomNormal(mnfProjectedTotalPoints, stdDevMNF);

            // 3. Evaluar aciertos de los jugadores
            let maxPoints = -1;
            const simScores = PLAYERS.map(player => {
                let pts = 0;
                liveMatchesState.forEach(m => {
                    if (player.picks[m.id] === simWinners[m.id]) pts++;
                });
                if (pts > maxPoints) maxPoints = pts;
                return pts;
            });

            // 4. Obtener empatados en primer lugar
            let tiedIndices = [];
            simScores.forEach((score, idx) => {
                if (score === maxPoints) tiedIndices.push(idx);
            });

            // 5. Romper el empate con la cercanía al MNF total simulado
            if (tiedIndices.length === 1) {
                winCounts[tiedIndices[0]] += 1;
            } else {
                let minDiff = Infinity;
                let tieWinners = [];

                tiedIndices.forEach(idx => {
                    const diff = Math.abs(PLAYERS[idx].mnfTotal - simulatedMNFTotal);
                    if (diff < minDiff) {
                        minDiff = diff;
                        tieWinners = [idx];
                    } else if (diff === minDiff) {
                        tieWinners.push(idx);
                    }
                });

                tieWinners.forEach(wIdx => {
                    winCounts[wIdx] += (1 / tieWinners.length);
                });
            }
        }

        return winCounts.map(count => ((count / numSimulations) * 100).toFixed(1));
    }

    function calculateAndRenderLeaderboard() {
        const winProbs = runMonteCarloSimulations();

        const playerScores = PLAYERS.map((player, idx) => {
            let weekCurrent = 0;
            let weekProjected = 0;

            liveMatchesState.forEach(m => {
                const pickedTeam = player.picks[m.id];
                if (!pickedTeam) return;

                const isHomeWinner = m.homeScore > m.awayScore;
                const isAwayWinner = m.awayScore > m.homeScore;
                const isTie = m.homeScore === m.awayScore;

                if (m.status === 'FINAL') {
                    if ((isHomeWinner && pickedTeam === m.home) || (isAwayWinner && pickedTeam === m.away)) {
                        weekCurrent++;
                        weekProjected++;
                    }
                } else if (m.status === 'LIVE') {
                    if ((isHomeWinner && pickedTeam === m.home) || (isAwayWinner && pickedTeam === m.away)) {
                        weekCurrent++;
                        weekProjected++;
                    } else if (isTie && pickedTeam === m.projectedWinner) {
                        weekProjected++;
                    }
                } else if (m.status === 'PENDING') {
                    if (pickedTeam === m.projectedWinner) {
                        weekProjected++;
                    }
                }
            });

            return {
                name: player.name,
                rawMNF: player.rawMNF,
                weekCurrent: weekCurrent,
                weekProjected: weekProjected,
                winProb: winProbs[idx]
            };
        });

        // Ordenar por Puntos Actuales, Proyectados y Win Prob %
        playerScores.sort((a, b) => b.weekCurrent - a.weekCurrent || b.weekProjected - a.weekProjected || b.winProb - a.winProb);

        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = '';

        playerScores.forEach((ps, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="rank">${index + 1}</td>
                <td class="player-name">${ps.name}</td>
                <td><strong style="color: #cbd5e1;">${ps.rawMNF}</strong></td>
                <td><span class="badge-score">${ps.weekCurrent}</span></td>
                <td><span class="badge-projected">${ps.weekProjected}</span></td>
                <td><span class="badge-winprob">${ps.winProb}%</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    fetchESPNLiveScores();
    setInterval(() => fetchESPNLiveScores(false), 30000);
</script>

</body>
</html>
